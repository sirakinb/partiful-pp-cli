version: 2
project_name: partiful-pp-cli
changelog:
  disable: true
builds:
  - id: partiful-pp-cli
    main: ./cmd/partiful-pp-cli
    binary: partiful-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X partiful-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: partiful-pp-mcp
    main: ./cmd/partiful-pp-mcp
    binary: partiful-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: partiful-pp-cli
    repository:
      owner: sirakinb
      name: homebrew-tap
    homepage: "https://github.com/sirakinb/partiful-pp-cli"
    description: "Create, edit, and inspect your own Partiful events and guest lists from the terminal or an AI agent."
    install: |
      bin.install "partiful-pp-cli"
      bin.install "partiful-pp-mcp"
